[build]
  publish = "."
  command = ""

# Optional: clean URLs and HTTPS headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep old adventure URL working (it already redirects via meta refresh, this is a backup)
[[redirects]]
  from = "/explorer/head-of-government/adventure/"
  to = "/"
  status = 301
